source = ~/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = $wallpaper
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.55
    vibrancy    = 0.15
}

label {
    monitor     =
    text        = $TIME
    position    = 0, 110
    halign      = center
    valign      = center
    color       = $foreground
    font_family = sans-serif
    font_size   = 88
    font_weight = 100
}

label {
    monitor     =
    text        = cmd[update:300000] date +'%a %-d %b' | tr '[:upper:]' '[:lower:]'
    position    = 0, 30
    halign      = center
    valign      = center
    color       = $foreground
    font_family = sans-serif
    font_size   = 11
    opacity     = 0.5
}

input-field {
    monitor           =
    size              = 220, 44
    position          = 0, -60
    halign            = center
    valign            = center
    outline_thickness = 2
    outer_color       = rgba(0, 0, 0, 0)
    rounding          = 15
    inner_color       = rgba(255, 255, 255, 0.07)
    font_color        = $foreground
    check_color       = $accent
    fail_color        = $warn
    capslock_color    = $warn
    font_family       = JetBrainsMono Nerd Font
    font_size         = 12
    placeholder_text  = 󰌾
    fail_text         =
    dots_size         = 0.2
    dots_spacing      = 0.4
    dots_center       = true
    fade_on_empty     = false
}
